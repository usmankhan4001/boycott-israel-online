<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0f19" />
      <stop offset="100%" stop-color="#111827" />
    </linearGradient>
    <linearGradient id="greenGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#059669" />
      <stop offset="100%" stop-color="#047857" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="8" flood-color="#000000" flood-opacity="0.5"/>
    </filter>
  </defs>
  
  <!-- Outer Rounded Square -->
  <rect width="512" height="512" rx="128" fill="url(#bgGrad)"/>
  <rect width="504" height="504" x="4" y="4" rx="124" fill="none" stroke="#059669" stroke-width="4" stroke-opacity="0.4"/>
  
  <!-- Palestinian Shield Motif -->
  <g filter="url(#shadow)">
    <!-- Top Stripe (Black) -->
    <path d="M120 140 C120 140 256 120 256 120 C256 120 392 140 392 140 L392 200 L120 200 Z" fill="#111827" stroke="#374151" stroke-width="2"/>
    <!-- Middle Stripe (White) -->
    <path d="M120 200 L392 200 L392 270 L120 270 Z" fill="#FFFFFF"/>
    <!-- Bottom Stripe (Green) -->
    <path d="M120 270 L392 270 L392 320 C392 390 256 440 256 440 C256 440 120 390 120 320 Z" fill="url(#greenGrad)"/>
    <!-- Red Chevron / Triangle -->
    <path d="M120 140 L260 270 L120 380 Z" fill="#CE1126"/>
  </g>
  
  <!-- Inner White Peace Dove / Checkmark Symbol -->
  <path d="M220 280 L250 310 L330 230" fill="none" stroke="#FFFFFF" stroke-width="20" stroke-linecap="round" stroke-linejoin="round" filter="url(#shadow)"/>
  
  <!-- Accent Text -->
  <text x="256" y="480" font-family="Arial, sans-serif" font-weight="900" font-size="28" fill="#10B981" text-anchor="middle" letter-spacing="4">FREE PALESTINE</text>
</svg>